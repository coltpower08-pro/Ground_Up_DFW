# Every push to main: run the tests, build the game, and publish it to Firebase Hosting with the database rules and indexes.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove to Google which repo is deploying (no key file)

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110526487227/locations/global/workloadIdentityPools/github/providers/ground-up-repo
          service_account: github-deploy@ground-up-dfw.iam.gserviceaccount.com
      - name: Publish to Firebase
        run: |
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          npx --yes firebase-tools@latest deploy --only hosting,firestore --project "$PROJECT" --non-interactive --force
          echo "Live at https://$PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"
