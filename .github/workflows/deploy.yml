# Every push to main: run the tests, build the game, and publish it to Firebase Hosting with the database rules and indexes.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret in the repo's Settings > Secrets and variables > Actions."; exit 1; fi
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          if [ "$PROJECT" = "YOUR-FIREBASE-PROJECT-ID" ]; then echo "::error::Put your Firebase project ID in .firebaserc."; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node -e "const k=JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Deploying as', k.client_email, 'from key for project', k.project_id)"
          npx --yes firebase-tools@latest deploy --only hosting,firestore --project "$PROJECT" --non-interactive --force
          echo "Live at https://$PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"
